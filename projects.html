<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects - Nakul Rejeesh</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <div class="nav-brand">
      <span class="nav-name">nakul</span>
    </div>
    <ul>
      <li><a href="index.html">home</a></li>
      <li><a href="projects.html" class="active">projects</a></li>
    </ul>
  </nav>

  <main class="projects">
    <h2>projects</h2>
    <p class="projects-sub">pick a CD for what i built</p>


    <section class="shelf" aria-label="Projects">
      <div class="shelf-row" id="shelf-row" role="tablist" aria-label="Pick a CD"></div>
      <article class="cd-detail" id="cd-detail" role="tabpanel" aria-live="polite"></article>
    </section>

    <section class="contrib" id="contrib" data-user="n4kulr" aria-label="GitHub contributions">
      <div class="contrib-head">
        <span class="contrib-title">github activity</span>
        <a class="contrib-link" href="https://github.com/n4kulr" target="_blank" rel="noopener">@n4kulr →</a>
      </div>
      <div class="contrib-scroll">
        <div class="contrib-inner">
          <div class="contrib-months" aria-hidden="true"></div>
          <div class="contrib-grid"></div>
        </div>
      </div>
      <div class="contrib-foot">
        <span class="contrib-total">loading contributions…</span>
        <span class="contrib-legend" aria-hidden="true">less <i data-level="0"></i><i data-level="1"></i><i data-level="2"></i><i data-level="3"></i><i data-level="4"></i> more</span>
      </div>
    </section>
  </main>

  <script src="contrib.js"></script>
  <script src="shelf.js"></script>
</body>
</html>
